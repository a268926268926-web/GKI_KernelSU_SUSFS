name: OnePlus 15 locked staged build

on:
  push:
    branches: [oneplus15-6.12.96-r22]
    paths: [personal/**, .github/workflows/personal-oneplus15.yml]
  workflow_dispatch:
    inputs:
      variant:
        description: A/B baseline or staged C feature build
        type: choice
        options: [A, B, C1, C2, C2D1, C2D2, C3, C]
        default: C1
      use_cache:
        description: Reuse this recipe's Bazel cache; disable for a cold build
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: personal-oneplus15-${{ github.ref }}-${{ inputs.variant || 'C1' }}
  cancel-in-progress: false

env:
  BUILD_VARIANT: ${{ inputs.variant || 'C1' }}
  KBUILD_BUILD_USER: kleaf
  KBUILD_BUILD_HOST: build-host

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve locked build target
        id: target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          locks = json.loads(Path("personal/locks.json").read_text())
          assert re.fullmatch(r"\d+\.\d+\.\d+", locks["version"])
          assert re.fullmatch(r"android\d+-\d+\.\d+", locks["target"])
          assert locks["patch_level"] == "lts"
          epoch = int(locks["source_date_epoch"])
          outputs = {"version": locks["version"], "sublevel": locks["version"].split(".")[-1],
                     "patch_level": locks["patch_level"], "page_size": locks["page_size"]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          timestamp = datetime.fromtimestamp(epoch, timezone.utc).strftime("%a %b %e %H:%M:%S UTC %Y")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SOURCE_DATE_EPOCH={epoch}\nKBUILD_BUILD_TIMESTAMP={timestamp}\n")
          print(f"Locked {locks['version']} / {locks['patch_level']} / {locks['page_size']}")
          PY

      - name: Require successful A before B
        if: env.BUILD_VARIANT == 'B'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/personal-oneplus15.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.display_title == "OnePlus 15 A") | .id' > /tmp/prior-a-runs
          test -s /tmp/prior-a-runs

      - name: Require prior successful C stage
        if: env.BUILD_VARIANT == 'C2' || env.BUILD_VARIANT == 'C2D1' || env.BUILD_VARIANT == 'C2D2' || env.BUILD_VARIANT == 'C3' || env.BUILD_VARIANT == 'C'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$BUILD_VARIANT" in
            C2|C2D1|C2D2) prior=C1 ;;
            C3) prior=C2 ;;
            C)  prior=C3 ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/personal-oneplus15.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
            --jq '.workflow_runs[].display_title' > /tmp/prior-c-runs
          grep -Fx "OnePlus 15 $prior" /tmp/prior-c-runs

      - name: Free runner disk
        uses: endersonmenezes/free-disk-space@d8d1e404d2314ff42e5393ba5545d192ae63afd4 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true

      - name: Swap for ThinLTO
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Prepare tools and locked manifest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl zip rsync flex bison libelf-dev libssl-dev python3 python3-yaml
          mkdir -p kernel evidence deliverables git-repo
          cp personal/locks.json personal/manifest.xml evidence/
          jq -n --arg runner "$ImageOS/$ImageVersion" --arg commit "$GITHUB_SHA" \
            --arg variant "$BUILD_VARIANT" --arg run "$GITHUB_RUN_ID" \
            '{runner:$runner,workflow_commit:$commit,variant:$variant,run:$run}' > evidence/build-context.json
          repo_sha="$(jq -r .repo_tool personal/locks.json)"
          curl -fLsS --retry 3 "https://gerrit.googlesource.com/git-repo/+/${repo_sha}/repo?format=TEXT" | base64 -d > git-repo/repo
          chmod +x git-repo/repo
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          git -C personal init --initial-branch=locked
          git -C personal -c user.name=builder -c user.email=builder@localhost add manifest.xml
          git -C personal -c user.name=builder -c user.email=builder@localhost commit -m 'Pinned manifest'

      - name: Check personal workflow and locked source contracts
        run: /usr/bin/python3 personal/check.py

      - name: Sync exact source snapshot
        working-directory: kernel
        run: |
          set -euo pipefail
          repo_sha="$(jq -r .repo_tool ../personal/locks.json)"
          repo init -u "$GITHUB_WORKSPACE/personal" -b locked -m manifest.xml --depth=1 \
            --repo-rev="$repo_sha" --no-repo-verify
          repo sync -c --no-tags --no-clone-bundle --fail-fast -j4
          repo manifest -r -o "$GITHUB_WORKSPACE/evidence/resolved-manifest.xml"
          python3 ../personal/verify_manifest.py

      - name: Fetch locked components and native SUSFS integration
        run: python3 personal/setup.py

      - name: Networking and firewall
        uses: ./.github/actions/networking-config
      - name: CIFS
        uses: ./.github/actions/cifs
        with:
          version: android16-6.12
      - name: Container support
        uses: ./.github/actions/droidspaces
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: '6.12'
          sublevel: ${{ steps.target.outputs.sublevel }}
          os_patch_level: ${{ steps.target.outputs.patch_level }}
          droidspaces_commit: 847ecdd2c9431f3fa69647eed4060738275aeece
      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android16-6.12
          kernel_version: '6.12'
          sublevel: ${{ steps.target.outputs.sublevel }}
      - name: Unicode compatibility
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: '6.12'
      - name: Miscellaneous baseline config
        uses: ./.github/actions/misc
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: '6.12'
          sublevel: ${{ steps.target.outputs.sublevel }}
          variant: BakaSU
      - name: BTF, eBPF and FUSE-BPF
        uses: ./.github/actions/btf
        with:
          version: android16-6.12
          kernel_version: '6.12'
          sublevel: ${{ steps.target.outputs.sublevel }}
      - name: SUSFS feature configuration
        uses: ./.github/actions/susfs-config
      - name: NoMount and Baseband Guard configuration
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_NOMOUNT=y
            CONFIG_BBG=y
      - name: Add Baseband Guard to default LSM list
        run: |
          set -euo pipefail
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' kernel/common/security/Kconfig
          grep -q 'selinux,baseband_guard' kernel/common/security/Kconfig
      - name: Kernel host compatibility
        uses: ./.github/actions/kernel-fixes
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: '6.12'
          sublevel: ${{ steps.target.outputs.sublevel }}
          os_patch_level: ${{ steps.target.outputs.patch_level }}
      - name: Branding with KMI generation retained
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: BakaSU
          kernel_version: '6.12'
          android_version: android16
          version: android16-6.12
          sublevel: ${{ steps.target.outputs.sublevel }}
          brand_name: Personal${{ env.BUILD_VARIANT }}
          keep_kmi: 'true'
      - name: Wild module export policy
        uses: ./.github/actions/remove-protected-exports

      - name: Apply locked LZ4 source chain
        if: startsWith(env.BUILD_VARIANT, 'C')
        run: python3 personal/apply_lz4.py

      - name: Apply locked BBRv3 source backport
        if: env.BUILD_VARIANT == 'C2' || env.BUILD_VARIANT == 'C2D2' || env.BUILD_VARIANT == 'C3' || env.BUILD_VARIANT == 'C'
        run: python3 personal/apply_network.py

      - name: Apply locked Re:Kernel source integration
        if: env.BUILD_VARIANT == 'C3' || env.BUILD_VARIANT == 'C'
        run: python3 personal/apply_rekernel.py

      - name: Assert version and final requested choices
        run: python3 personal/configure.py

      - name: Archive source changes before compilation
        run: python3 personal/evidence.py source

      - name: Prepare optional Bazel cache
        id: cache
        if: github.event_name == 'push' || inputs.use_cache
        continue-on-error: true
        env:
          RECIPE_HASH: ${{ hashFiles('personal/*.py', 'personal/locks.json', 'personal/manifest.xml', 'personal/patches/**', 'personal/lz4/**', 'personal/adios/**', 'personal/modules/**', '.github/actions/**', '.github/workflows/personal-oneplus15.yml', '!**/__pycache__/**') }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          # Include the immutable source/toolchain locks, full recipe and actual
          # runner image. Never restore an opaque output_user_root or source tree.
          identity = {key: os.environ.get(key, "") for key in
                      ["RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion", "RECIPE_HASH", "BUILD_VARIANT"]}
          identity["execution_mode"] = "sandbox"
          assert identity["ImageVersion"] and identity["RECIPE_HASH"]
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          prefix = f"personal-bazel-v2-{digest}-"
          root = Path(os.environ["RUNNER_TEMP"]) / "personal-bazel-cache"
          for name in ["disk", "repository"]:
              (root / name).mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prefix={prefix}\nroot={root}\n")
          Path("evidence/cache-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          PY

      - name: Restore Bazel action and download caches
        id: restore-cache
        if: steps.cache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache.outputs.root }}
          key: ${{ steps.cache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.prefix }}

      - name: Build selected kernel and symbols
        id: compile
        working-directory: kernel
        env:
          PERSONAL_CACHE_ROOT: ${{ steps.cache.outcome == 'success' && steps.restore-cache.outcome == 'success' && steps.cache.outputs.root || '' }}
          CACHE_MATCHED_KEY: ${{ steps.restore-cache.outputs.cache-matched-key }}
          CACHE_RESTORE_OUTCOME: ${{ steps.restore-cache.outcome }}
        run: |
          set -euo pipefail
          targets=(//common:kernel_aarch64)
          cache_flags=()
          if [[ -n "$PERSONAL_CACHE_ROOT" ]]; then
            cache_flags+=("--disk_cache=$PERSONAL_CACHE_ROOT/disk" "--repository_cache=$PERSONAL_CACHE_ROOT/repository")
          fi
          if [[ "$BUILD_VARIANT" == "C3" || "$BUILD_VARIANT" == "C" ]]; then
            targets+=(//common:kernel_aarch64_modules)
          fi
          started="$(date +%s)"
          record_build_time() {
            elapsed=$(( $(date +%s) - started ))
            jq -n --arg matched "$CACHE_MATCHED_KEY" --arg restore "$CACHE_RESTORE_OUTCOME" \
              --arg root "$PERSONAL_CACHE_ROOT" --argjson seconds "$elapsed" \
              '{matched_key:$matched,restore_outcome:$restore,cache_enabled:($root != ""),build_seconds:$seconds}' \
              > ../evidence/cache-build.json
          }
          trap record_build_time EXIT
          # fast implies local, whose LOCAL tag forbids caching KernelBuild.
          # Use standard sandbox execution so the main kernel action is cacheable.
          tools/bazel build "${cache_flags[@]}" --profile=../evidence/bazel-profile.json.gz "${targets[@]}" \
            2>&1 | tee ../evidence/build.log

      - name: Measure cache before saving
        id: cache-size
        if: always() && !cancelled() && steps.cache.outcome == 'success' && steps.restore-cache.outcome == 'success' && steps.compile.outcome != 'skipped'
        continue-on-error: true
        env:
          PERSONAL_CACHE_ROOT: ${{ steps.cache.outputs.root }}
        run: |
          set -euo pipefail
          # Oversized entries are skipped intact, not pruned into broken CAS/AC pairs.
          bytes="$(du -sb "$PERSONAL_CACHE_ROOT" | cut -f1)"
          jq -n --argjson bytes "$bytes" '{bytes:$bytes,max_save_bytes:4294967296}' > evidence/cache-size.json
          echo "Bazel cache size: $bytes bytes"
          if (( bytes > 0 && bytes <= 4294967296 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Save bounded Bazel caches
        if: always() && !cancelled() && steps.cache-size.outcome == 'success' && steps.cache-size.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache.outputs.root }}
          key: ${{ steps.cache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package optional C3 extra modules
        if: env.BUILD_VARIANT == 'C3' || env.BUILD_VARIANT == 'C'
        run: python3 personal/package_extra_modules.py

      - name: Verify real config, native symbols and deliverable hashes
        run: python3 personal/evidence.py package

      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OnePlus15-${{ env.BUILD_VARIANT }}-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Deliver verified candidate files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OnePlus15-${{ env.BUILD_VARIANT }}-${{ steps.target.outputs.version }}-${{ steps.target.outputs.page_size }}
          path: deliverables/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

run-name: OnePlus 15 ${{ inputs.variant || 'C1' }}
